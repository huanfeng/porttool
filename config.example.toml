# PortTool 配置示例

[server]
# 监听地址（HTTP 和 Terminal 服务共用）
bind = "0.0.0.0"
# HTTP API 端口
http_port = 7000
# 日志根目录（可选，默认为配置文件旁的 logs/）
# log_dir = "/var/log/porttool"
# HTTP API 认证 token（可选）
# token = "your-secret-token"
# 串口内存缓冲行数
buffer_lines = 20000

# 串口转发规则
[[rule]]
type = "serial"
name = "esp32"
# USB 序列号（优先，换 USB 口也能识别）
serial_number = "A50285BI"
# 或指定串口名称
# com = "COM3"
baud = 115200
tcp_port = 7001
# 终端模式：telnet 或 raw
mode = "telnet"
# 编码：utf-8 或 gbk
encoding = "utf-8"
enabled = true

# SSH 端口转发规则（本机 → 远端）
[[rule]]
type = "ssh"
name = "dev-proxy"
ssh_target = "user@remote.server"
# SSH 端口（可选，留空使用 SSH 配置）
# ssh_port = 22
# 私钥路径（可选，留空使用系统配置和代理）
# identity_file = "/path/to/id_rsa"
# 转发方向：local（本机→远端，-L）或 remote（远端→本机，-R）
direction = "local"
local_port = 8086
remote_host = "127.0.0.1"
remote_port = 8086
# 连接中断后自动重连
auto_reconnect = true
enabled = true

# SSH 端口转发规则（远端 → 本机）
[[rule]]
type = "ssh"
name = "db-tunnel"
ssh_target = "jump-server"
direction = "remote"
local_port = 3306
remote_host = "db.internal.lan"
remote_port = 3306
auto_reconnect = false
enabled = false

# TCP 端口转发规则
[[rule]]
type = "tcp"
name = "local-forward"
listen = "127.0.0.1:9090"
target = "192.168.1.100:80"
# 最大并发连接数（默认 1000）
max_connections = 1000
enabled = true
