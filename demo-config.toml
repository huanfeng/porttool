# PortTool 演示 / 测试用配置：规则多，用来看列表滚动、各种状态和告警条。
# 安全：只监听 127.0.0.1；SSH 目标用 .invalid 域名，不会真正外连；串口 COM250+ 不存在，处于“等待设备”。
#
#   porttoolw --no-single-instance --config demo-config.toml
#
# --no-single-instance 让它能和已经在运行的 PortTool 并存，也不会改动开机自启。

[server]
bind = "127.0.0.1"
http_port = 47800

[[rule]]
type = "serial"
name = "uart-1"
com = "COM250"
baud = 115200
tcp_port = 47801
mode = "telnet"
enabled = true

[[rule]]
type = "serial"
name = "uart-2"
com = "COM251"
baud = 921600
tcp_port = 47802
mode = "telnet"
enabled = true

[[rule]]
type = "serial"
name = "uart-3"
com = "COM252"
baud = 1500000
tcp_port = 47803
mode = "telnet"
enabled = false

[[rule]]
type = "serial"
name = "uart-4"
com = "COM253"
baud = 9600
tcp_port = 47804
mode = "raw"
enabled = true

[[rule]]
type = "serial"
name = "uart-5"
com = "COM254"
baud = 115200
tcp_port = 47805
mode = "telnet"
enabled = true

